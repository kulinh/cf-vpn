name = "cfvpn-panel-api"
main = "src/index.ts"
compatibility_date = "2026-04-21"

# workers.dev stays ENABLED because the Telegram webhook is registered against
# it (the custom domain cp.rwl265.com only routes /api/* and /sub/*, so
# /telegram/webhook is unreachable there). To stop workers.dev from bypassing
# Cloudflare Access on the admin surface, src/index.ts rejects every path except
# /telegram/webhook when the request arrives on a *.workers.dev hostname.

[observability]
enabled = true

[triggers]
# 17 3 * * *  — daily events prune (90-day retention)
# */5 * * * * — fleet healthcheck sweep (keeps nodes.last_seen_at live)
crons = ["17 3 * * *", "*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cfvpn_panel_prod"
database_id = "0649f07f-e2c0-47f3-b84a-273f7f67332e"
preview_database_id = "7b2b5a09-3c4d-45e2-aff4-6a414e734500"

[vars]
SERVICE_TOKEN_HEADER_ID = "CF-Access-Client-Id"
SERVICE_TOKEN_HEADER_SECRET = "CF-Access-Client-Secret"
ADMIN_HOST_ALLOWED_SUFFIXES = "rwl265.com,888vn.net,dongnat247.com,rwl247.dev,rwl265.org"
TELEGRAM_GROUP_ID = "-1003806233980"
# Subscription links handed out by the bot must point at the custom domain: the
# webhook itself arrives on *.workers.dev, where /sub/* is 404 by design.
PANEL_PUBLIC_ORIGIN = "https://cp.rwl265.com"
